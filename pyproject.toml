[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multilingual"
version = "0.1.0"
description = "Adapter Stacking for Cross-Lingual Domain Adaptation in Swahili Biomedical NLP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Amir Yousefi" }]

dependencies = [
    # ★ HF adapters (Poth 2023, successor to AdapterHub). Pip name: `adapters`, NOT `adapter-transformers`.
    "adapters>=0.2.2",
    "transformers>=4.39.0,<4.50.0",
    "torch>=2.2.0",
    "datasets>=2.18.0",
    "accelerate>=0.28.0",
    "tokenizers>=0.15.0",
    "sentencepiece>=0.2.0",
    "evaluate>=0.4.1",
    "seqeval>=1.2.2",
    "torchmetrics>=1.3.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "datasketch>=1.6.4",
    "fasttext-wheel>=0.9.2",
    "sacrebleu>=2.4.0",
    "deepsig>=1.2.6",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "wandb>=0.16.4",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=4.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
flash = ["flash-attn>=2.5.0"]
dev = ["pytest>=8.0.0", "ruff>=0.3.0", "mypy>=1.9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
